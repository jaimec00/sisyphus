# Pytest configuration for this package.
#
# The ROS 2 Jazzy `launch_testing` / `launch_ros` pytest plugins shipped in the
# RoboStack environment declare hooks that pytest >= 8 no longer accepts, so
# merely *loading* them aborts the whole session:
#
#   PluginValidationError: Plugin 'launch_testing' for hook
#   'pytest_pycollect_makemodule' ... Argument(s) {'path'} ... can not be found
#
# This package does not use launch_testing (no ROS graph, no launch files), so
# they are disabled here. Remove this file once the environment ships a
# launch_testing compatible with the installed pytest.
[pytest]
addopts = -p no:launch_testing -p no:launch_ros
testpaths = test
