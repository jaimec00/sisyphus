# Nav2 localization layer parameters (PR1 / issue #121).
#
# Deliberately minimal: PR1 stands up ground-truth localization only.  The
# planner / controller / costmap / BT navigator params are PR2's, and AMCL's
# are deferred (nothing produces a scan -- D36).  The values here are the
# node defaults, written out so an operator can see and retune the derivation
# without reading the source.
map_node:
  ros__parameters:
    # Metres per cell of the derived occupancy grid (RULING 3: ~5 cm).
    resolution: 0.05
    # Padding, in metres, added on every side of the locations+objects extent.
    margin: 1.0
    # Radius, in metres, of the square an object occupies around its (x, y)
    # projection.  Small on purpose: objects mark their own spot without
    # walling off a room.
    footprint_radius: 0.05
    # Seconds to wait for /world_query/get_world during on_configure before
    # the lifecycle configure fails (a manager may retry; the node never hangs).
    service_wait_timeout: 30.0
    # Seconds between periodic /map republishes while ACTIVE, on top of the
    # transient-local latch.
    republish_period: 5.0

ground_truth_odom:
  ros__parameters:
    # TF broadcast rate for the ground-truth odom -> base_link transform.
    publish_rate: 50.0
