# IK solver parameters (R7). KDL only.
#
# `kinematics_solver` names the plugin *class* (the part before the `/`), whose
# library is resolved through the kinematics plugin loader. Verified against the
# installed env: `kdl_kinematics_plugin/KDLKinematicsPlugin` ships in
# `libmoveit_kdl_kinematics_plugin.so`. TRAC-IK is deliberately NOT built this
# PR -- it is absent from the ROS 2 Jazzy / RoboStack channel (the cached-IK
# plugin XML has its <class> commented out, D39). It stays the documented
# fallback if KDL convergence proves inadequate once real Cartesian goals land
# (PR2/PR3): swap the two class strings below and add the source/package then.
#
# One block per *planning group* that carries Cartesian goals. The gripper
# groups are single-DOF and get no IK entry -- they are commanded by joint
# value, not pose.
left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  # 0.0 = use every iteration the solver is allowed; KDL has no early-exit.
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3

right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
