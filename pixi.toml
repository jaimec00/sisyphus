[project]
name = "sisyphus"
version = "0.0.0"
description = "Autonomous household-chore robot — LLM-operated mobile manipulator (ROS 2 Jazzy)."
authors = ["Jaime C."]
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
# Core ROS 2 Jazzy via RoboStack + colcon build tooling.
ros-jazzy-desktop = "*"
colcon-common-extensions = "*"
# Workspace source management
python = "*"
# The workspace-tooling suite shells out to real `git init`/`git add` (the
# guard decides package ownership from the git index), so git must come from
# the environment rather than leaking in from the host: on a container built
# from `pixi install` alone there is no ambient git and those tests error.
git = "*"
# Node.js + npm, so the OpenClaw brain (D21) can be installed and run from the
# same env as the robot stack instead of leaking in from the host. Pinned to
# the 24.x line: it matches the Node the Pi already runs OpenClaw on, and
# openclaw's own `engines` field is
#   ">=22.22.3 <23 || >=24.15.0 <25 || >=25.9.0"
# so a loose ">=22" could legally resolve to a Node (23.x, 25.0-25.8) that
# openclaw refuses to start on. 24.19.0 is available on both linux-64 and
# linux-aarch64.
nodejs = ">=24.15,<25"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-urdfdom-py = ">=1.2.1,<2"
ros-jazzy-urdfdom = ">=6.0,<7"
ros-jazzy-robot-state-publisher = ">=3.3.3,<4"
ros-jazzy-joint-state-publisher = ">=2.4.0,<3"
mujoco = ">=3.12.0,<4"
ros-jazzy-controller-manager = ">=4.45.1,<5"
ros-jazzy-hardware-interface = ">=4.45.1,<5"
ros-jazzy-transmission-interface = ">=4.45.1,<5"
ros-jazzy-control-toolbox = ">=4.11.0,<5"
ros-jazzy-realtime-tools = ">=3.11.0,<4"
ros-jazzy-joint-state-broadcaster = ">=4.40.0,<5"
ros-jazzy-position-controllers = ">=4.40.0,<5"
ros-jazzy-velocity-controllers = ">=4.40.0,<5"
ros-jazzy-backward-ros = ">=1.0.8,<2"
ros-jazzy-tinyxml2-vendor = ">=0.9.2,<0.10"
vcstool = ">=1.1.7,<2"
ros-jazzy-ros2-control-cmake = ">=0.4.0,<0.5"
libcap = ">=2.78,<3"
glfw = ">=3.5.1,<4"
lttng-ust = ">=2.13.9,<3"

# TODO (verify availability on robostack-jazzy; source-build in this env if missing):
#   ros-jazzy-moveit                (MoveIt 2 — confirmed present on channel)
#   ros-jazzy-navigation2           (Nav2)
#   ros-jazzy-nav2-bringup
#   ros-jazzy-foxglove-bridge
#   mujoco_ros2_control             (likely source-build via robot.repos)

[tasks]
build = "colcon build --symlink-install"
# `colcon test` reports success for a package that collected zero tests, and
# `colcon test-result` hides such a result unless --all is passed. This driver
# runs colcon (plus the workspace-tooling suite), surfaces every result, and
# fails if any package produced no tests -- see scripts/check_test_integrity.py.
test = { cmd = "python scripts/check_test_integrity.py", depends-on = ["check-provisioning"] }
# Front-run the suite with the un-provisioned-worktree check: a missing
# `install-openclaw` is otherwise six opaque robot_brain failures at the end of
# a full colcon run. pixi aborts `test` and propagates the exit code when a
# `depends-on` task fails. Deliberately *not* a dependency of `test-audit`,
# which only re-reads XML that already exists.
check-provisioning = "python scripts/check_provisioning.py"
# Re-read the results already in build/ without re-running anything.
test-audit = "python scripts/check_test_integrity.py --audit-only"
# Boot the MCP server through the deployed launcher and speak MCP to it. This
# also runs inside `pixi run test` (the workspace-tooling suite collects all of
# scripts/tests/); the task is here so the deploy check can be run on its own.
# The two `-p no:` flags work around the RoboStack pytest plugins, exactly as
# the per-package pytest.ini files and check_test_integrity.py do.
boot-smoke = "python -m pytest scripts/tests/test_boot_smoke.py -p no:launch_testing -p no:launch_ros"
# Install the OpenClaw brain into a project-local npm prefix (`node/`, gitignored)
# using the pixi-provided Node/npm -- never `npm i -g` into the host.
install-openclaw = "bash scripts/install_openclaw.sh"
# Run the project-local OpenClaw; trailing args are forwarded
# (`pixi run openclaw --version`).
openclaw = { cmd = "node/node_modules/.bin/openclaw", depends-on = ["install-openclaw"] }

[pypi-dependencies]
mcp = ">=2.0.0, <3"

[activation.env]
# The source-built mujoco_ros2_control/plugins link against conda-native libs
# (lttng-ust, cap, glfw) by bare name; the linker needs the env lib dir on
# LIBRARY_PATH (the same setting the upstream mujoco_ros2_control pixi.toml
# uses). LD_LIBRARY_PATH alone does not satisfy the -L search.
LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LIBRARY_PATH}"
# pixi does not put the conda env 'lib/' on LD_LIBRARY_PATH, and ament's
# colcon setup.bash recomputes it from the ament prefixes, so a runtime node
# cannot find conda-native links such as libbackward.so / libglfw (the
# source-built mujoco_ros2_control links them). Keep the env lib on the
# runtime loader path explicitly.
LD_LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}"
